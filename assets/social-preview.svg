      <text x="71" y="28" text-anchor="middle" class="font cyan" font-size="18" font-weight="800">Think</text>
      <rect x="156" y="0" width="142" height="42" rx="21" fill="#111827" stroke="#22d3ee" stroke-opacity="0.30"/>
      <text x="227" y="28" text-anchor="middle" class="font cyan" font-size="18" font-weight="800">Simple</text>
      <rect x="312" y="0" width="142" height="42" rx="21" fill="#111827" stroke="#f59e0b" stroke-opacity="0.34"/>
      <text x="383" y="28" text-anchor="middle" class="font amber" font-size="18" font-weight="800">Surgical</text>
      <rect x="468" y="0" width="142" height="42" rx="21" fill="#111827" stroke="#f59e0b" stroke-opacity="0.30"/>
      <text x="539" y="28" text-anchor="middle" class="font amber" font-size="18" font-weight="800">Verify</text>
    </g>
  </g>

  <g transform="translate(548 424)">
    <g>
      <rect x="0" y="0" width="126" height="76" rx="18" fill="#0f172a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="18" y="30" class="mono" font-size="15" font-weight="800" fill="#67e8f9">01</text>
      <text x="18" y="56" class="font white" font-size="18" font-weight="760">Assume less</text>
    </g>
    <g transform="translate(146 0)">
      <rect x="0" y="0" width="126" height="76" rx="18" fill="#0f172a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="18" y="30" class="mono" font-size="15" font-weight="800" fill="#67e8f9">02</text>
      <text x="18" y="56" class="font white" font-size="18" font-weight="760">Ship less</text>
    </g>
    <g transform="translate(292 0)">
      <rect x="0" y="0" width="126" height="76" rx="18" fill="#0f172a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="18" y="30" class="mono" font-size="15" font-weight="800" fill="#fbbf24">03</text>
      <text x="18" y="56" class="font white" font-size="18" font-weight="760">Touch less</text>
    </g>
    <g transform="translate(438 0)">
      <rect x="0" y="0" width="126" height="76" rx="18" fill="#0f172a" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="18" y="30" class="mono" font-size="15" font-weight="800" fill="#fbbf24">04</text>
      <text x="18" y="56" class="font white" font-size="18" font-weight="760">Check more</text>
    </g>
  </g>

  <g transform="translate(98 518)">
    <text class="mono" font-size="16" fill="#64748b">npm install @micka33/pi-karpathy-skill</text>
