  <path d="M1008 188 C1082 204 1118 258 1128 342" fill="none" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="2"/>
  <path d="M132 424 C192 508 306 544 424 508" fill="none" stroke="#f59e0b" stroke-opacity="0.14" stroke-width="2"/>

