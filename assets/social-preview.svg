    <rect x="20" y="22" width="84" height="12" rx="6" fill="#67e8f9" opacity="0.85"/>
    <rect x="20" y="50" width="152" height="10" rx="5" fill="#94a3b8" opacity="0.45"/>
    <rect x="20" y="76" width="124" height="10" rx="5" fill="#94a3b8" opacity="0.35"/>
    <rect x="20" y="102" width="166" height="10" rx="5" fill="#fbbf24" opacity="0.5"/>
    <text x="122" y="35" class="mono" font-size="16" font-weight="700" fill="#e0f2fe">SKILL.md</text>
  </g>

