    <path d="M70 104 L170 154 L170 264 L70 212 Z" fill="#082f49" fill-opacity="0.33"/>
    <path d="M270 104 L170 154 L170 264 L270 212 Z" fill="#172554" fill-opacity="0.30"/>
    <text x="170" y="112" text-anchor="middle" class="font" font-size="84" font-weight="800" fill="#06111f" opacity="0.78">π</text>
    <text x="171" y="108" text-anchor="middle" class="font" font-size="84" font-weight="800" fill="#ecfeff">π</text>
  </g>

